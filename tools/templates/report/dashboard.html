<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<style>{{css}}</style>
</head>
<body class="dash">
{{radios}}
{{filters}}
<input type="checkbox" id="more" class="uin">
<header class="top">
  <div class="top-main">
    <h1>{{title}}</h1>
    <p class="meta">{{metaLine}}</p>
  </div>
  <nav class="tabs">{{nav}}</nav>
</header>
<main>
{{panels}}
</main>
<footer>
  <p>Sinh bởi <code>node tools/4ai.mjs report</code>. Mọi đề xuất trạng thái ở đây <strong>chưa được thi hành</strong> — chỉ chạy sau khi PM xác nhận.</p>
</footer>
<script>
document.querySelectorAll('.sql-copy').forEach(btn => {
  btn.addEventListener('click', async (e) => {
    e.preventDefault();
    const sqlPre = btn.closest('.sql').querySelector('pre');
    if (!sqlPre) return;

    const text = sqlPre.innerText;
    try {
      await navigator.clipboard.writeText(text);
      const orig = btn.textContent;
      btn.textContent = '✓ Copied';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = orig;
        btn.classList.remove('copied');
      }, 2000);
    } catch (err) {
      console.error('Failed to copy:', err);
    }
  });
});
</script>
</body>
</html>
